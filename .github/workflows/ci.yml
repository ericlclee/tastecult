name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tastecult
          POSTGRES_PASSWORD: tastecult
          POSTGRES_DB: tastecult_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tastecult"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://tastecult:tastecult@localhost:5432/tastecult_test
      TEST_DATABASE_URL: postgresql://tastecult:tastecult@localhost:5432/tastecult_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tastecult/db db:generate
      - run: pnpm --filter @tastecult/db db:deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
